name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: pnpm run test:inspection
      - name: Build
        run: pnpm run build